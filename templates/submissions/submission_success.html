{% extends "base.html" %}
{% block title %}Submission Saved | NasCOHST{% endblock %}
{% block content %}
<section class="max-w-3xl mx-auto bg-white rounded-2xl border shadow-sm p-8 text-center">
    <p class="text-sm uppercase tracking-widest text-primary font-semibold mb-2">Publications</p>
    <h1 class="text-3xl md:text-4xl font-bold text-gray-900">Submission Saved</h1>
    <p class="mt-4 text-lg text-gray-500">Your manuscript draft has been saved successfully.</p>
    <div class="mt-8 flex flex-wrap justify-center gap-3">
        <a href="{% url 'submissions:submission_dashboard' %}" class="inline-flex items-center rounded-xl bg-primary px-5 py-3 font-semibold text-white hover:bg-green-800 transition">
            View My Submissions
        </a>
        <a href="{% url 'submissions:submission_create' %}" class="inline-flex items-center rounded-xl border px-5 py-3 font-semibold text-gray-700 hover:bg-gray-50 transition">
            New Submission
        </a>
    </div>
</section>
{% endblock %}
